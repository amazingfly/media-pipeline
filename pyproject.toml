[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-media-pipeline"
version = "0.1.0"
description = "Resumable orchestration for SA3, images, and LTX video"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
publish = ["google-api-python-client", "google-auth-oauthlib", "requests"]

[project.scripts]
media-pipeline = "media_pipeline.runner:main"

[tool.setuptools.packages.find]
include = ["media_pipeline*"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
